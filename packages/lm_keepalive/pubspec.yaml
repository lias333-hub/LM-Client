name: lm_keepalive
description: Foreground service + wake lock so LMClient keeps working when the screen is off or the app is in the background (Android only).
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.lmclient.keepalive
        pluginClass: LmKeepalivePlugin
