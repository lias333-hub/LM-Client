name: LMClient
description: LMClient - Claude Clone
publish_to: 'none'
version: 2.6.0+1
environment:
  sdk: ">=3.2.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  flutter_markdown: ^0.7.3
  markdown: ^7.1.1
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.5
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: 9.2.2
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  dartssh2:
    git:
      url: https://github.com/vicajilau/dartssh2.git
      ref: v4.1.0
  xterm:
    git:
      url: https://github.com/TerminalStudio/xterm.dart.git
      ref: d35ba2cc72d0b89b0fd19af69d57df2c02f26a16
  pinenacl: ^0.6.0
  lm_termux:
    path: packages/lm_termux
  lm_keepalive:
