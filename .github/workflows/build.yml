name: Build APK (dev)
on:
  push:
    branches: [terminal-plus, merge-a]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true
      - name: Prepare Android project
        run: |
          set -e
          mkdir -p /tmp/bak ci_logs
          cp pubspec.yaml /tmp/bak/pubspec.yaml
          cp analysis_options.yaml /tmp/bak/analysis_options.yaml
          cp -r lib /tmp/bak/lib
          flutter create . --project-name lm_client --org com.lmclient --platforms android --overwrite
          cp /tmp/bak/pubspec.yaml ./pubspec.yaml
          cp /tmp/bak/analysis_options.yaml ./analysis_options.yaml
          rm -rf lib test
          cp -r /tmp/bak/lib ./lib
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="com.termux.permission.RUN_COMMAND" />\n    <queries><package android:name="com.termux" /></queries>\n    <application|' $MANIFEST
          cat $MANIFEST
      - name: pub get
        run: |
          set +e
          flutter pub get > ci_logs/1_pub_get.txt 2>&1
          echo $? > ci_logs/1_pub_get.rc
          exit 0
      - name: analyze
        run: |
          set +e
          if [ "$(cat ci_logs/1_pub_get.rc)" = "0" ]; then
            flutter analyze lib --no-fatal-infos --no-fatal-warnings > ci_logs/2_analyze.txt 2>&1
            echo $? > ci_logs/2_analyze.rc
          else
            echo "skipped (pub get failed)" > ci_logs/2_analyze.txt
            echo 99 > ci_logs/2_analyze.rc
          fi
          exit 0
      - name: build apk
        run: |
          set +e
          if [ "$(cat ci_logs/2_analyze.rc)" = "0" ]; then
            flutter build apk --release > ci_logs/3_build.txt 2>&1
            echo $? > ci_logs/3_build.rc
          else
            echo "skipped (analyze failed)" > ci_logs/3_build.txt
            echo 99 > ci_logs/3_build.rc
          fi
          exit 0
      - name: annotate errors
        if: always()
        run: |
          set +e
          awk -F ' • ' '/^ *error •/ {split($3,a,":"); printf "::error file=%s,line=%s,col=%s,title=%s::%s\n", a[1],a[2],a[3],$4,$2}' ci_logs/2_analyze.txt | head -10
          MSG=$( (grep -hE '^ *error •' ci_logs/2_analyze.txt | sed 's/^ *//' | head -60; grep -hiE 'error|Could not|Failed|Because|version solving' ci_logs/1_pub_get.txt | head -20; grep -hE 'Error:|error:|FAILURE|What went wrong|e: ' ci_logs/3_build.txt | head -40) | head -c 30000 | awk '{printf "%s%%0A", $0}')
          if [ -n "$MSG" ]; then echo "::error title=CI summary::$MSG"; fi
      - name: publish logs
        if: always()
        run: |
          set +e
          RUN="${{ github.run_number }}"
          git config --global user.name "ci-bot"
          git config --global user.email "ci-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          rm -rf /tmp/logrepo
          if git ls-remote --exit-code --heads "$REMOTE" ci-logs >/dev/null 2>&1; then
            git clone -q --depth 1 --branch ci-logs "$REMOTE" /tmp/logrepo
          else
            mkdir /tmp/logrepo
            git -C /tmp/logrepo init -q -b ci-logs
            git -C /tmp/logrepo remote add origin "$REMOTE"
          fi
          rm -rf /tmp/logrepo/latest
          mkdir -p /tmp/logrepo/latest
          cp ci_logs/* /tmp/logrepo/latest/ 2>/dev/null
          echo "run=$RUN sha=${{ github.sha }} branch=${{ github.ref_name }}" > /tmp/logrepo/latest/info.txt
          git -C /tmp/logrepo add -A
          git -C /tmp/logrepo commit -q -m "logs run $RUN"
          git -C /tmp/logrepo push -q origin ci-logs
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LMClient-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
      - name: gate
        if: always()
        run: |
          for f in ci_logs/*.rc; do
            v=$(cat "$f")
            if [ "$v" != "0" ]; then echo "failed: $f = $v"; exit 1; fi
          done
