name: Build APK (dev)
on:
  push:
    branches: [terminal-plus, merge-a]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true
      - name: Prepare Android project
        run: |
          set -e
          mkdir -p /tmp/bak ci_logs
          cp pubspec.yaml /tmp/bak/pubspec.yaml
          cp analysis_options.yaml /tmp/bak/analysis_options.yaml
          cp -r lib /tmp/bak/lib
          flutter create . --project-name lm_client --org com.lmclient --platforms android --overwrite
          cp /tmp/bak/pubspec.yaml ./pubspec.yaml
          cp /tmp/bak/analysis_options.yaml ./analysis_options.yaml
          rm -rf lib test
          cp -r /tmp/bak/lib ./lib
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="com.termux.permission.RUN_COMMAND" />\n    <queries><package android:name="com.termux" /></queries>\n    <application|' $MANIFEST
          sed -i '0,/<application/s|<application|<application android:allowBackup="false" android:fullBackupContent="false"|' $MANIFEST
          cat $MANIFEST
      - name: pub get
        run: |
          set +e
          flutter pub get > ci_logs/1_pub_get.txt 2>&1
          echo $? > ci_logs/1_pub_get.rc
          exit 0
      - name: analyze
        run: |
          set +e
          if [ "$(cat ci_logs/1_pub_get.rc)" = "0" ]; then
            flutter analyze lib --no-fatal-infos --no-fatal-warnings > ci_logs/2_analyze.txt 2>&1
            echo $? > ci_logs/2_analyze.rc
          else
            echo "skipped (pub get failed)" > ci_logs/2_analyze.txt
            echo 99 > ci_logs/2_analyze.rc
          fi
          exit 0
      - name: build apk
        run: |
          set +e
          if [ "$(cat ci_logs/2_analyze.rc)" = "0" ]; then
            flutter build apk --release > ci_logs/3_build.txt 2>&1
            echo $? > ci_logs/3_build.rc
          else
            echo "skipped (analyze failed)" > ci_logs/3_build.txt
            echo 99 > ci_logs/3_build.rc
          fi
          exit 0
      - name: annotate errors
        if: always()
        run: |
          set +e
          awk -F ' • ' '/^ *error •/ {split($3,a,":"); printf "::error file=%s,line=%s,col=%s,title=%s::%s\n", a[1],a[2],a[3],$4,$2}' ci_logs/2_analyze.txt | head -10
          MSG=$( (grep -hE '^ *error •' ci_logs/2_analyze.txt | sed 's/^ *//' | head -60; grep -hiE 'error|Could not|Failed|Because|version solving' ci_logs/1_pub_get.txt | head -20; grep -hE 'Error:|error:|FAILURE|What went wrong|e: ' ci_logs/3_build.txt | head -40) | head -c 30000 | awk '{printf "%s%%0A", $0}')
          if [ -n "$MSG" ]; then echo "::error title=CI summary::$MSG"; fi
      - name: publish logs
        if: always()
        run: |
          set +e
          RUN="${{ github.run_number }}"
          git config --global user.name "ci-bot"
          git config --global user.email "ci-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          rm -rf /tmp/logrepo
          if git ls-remote --exit-code --heads "$REMOTE" ci-logs >/dev/null 2>&1; then
            git clone -q --depth 1 --branch ci-logs "$REMOTE" /tmp/logrepo
          else
            mkdir /tmp/logrepo
            git -C /tmp/logrepo init -q -b ci-logs
            git -C /tmp/logrepo remote add origin "$REMOTE"
          fi
          rm -rf /tmp/logrepo/latest
          mkdir -p /tmp/logrepo/latest
          cp ci_logs/* /tmp/logrepo/latest/ 2>/dev/null
          echo "run=$RUN sha=${{ github.sha }} branch=${{ github.ref_name }}" > /tmp/logrepo/latest/info.txt
          git -C /tmp/logrepo add -A
          git -C /tmp/logrepo commit -q -m "logs run $RUN"
          git -C /tmp/logrepo push -q origin ci-logs
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LMClient-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
      - name: gate
        if: always()
        run: |
          for f in ci_logs/*.rc; do
            v=$(cat "$f")
            if [ "$v" != "0" ]; then echo "failed: $f = $v"; exit 1; fi
          done
  probe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LMClient-APK
          path: apk
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: start local sshd for the SSH self-test
        continue-on-error: true
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server > /dev/null
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ci_key -C lm-ci
          cat ci_key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          mkdir -p /tmp/lmci
          sudo /usr/sbin/sshd -p 2222 -o ListenAddress=127.0.0.1 -o PasswordAuthentication=no -o PubkeyAuthentication=yes
          sleep 2
          ssh -p 2222 -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$(whoami)@127.0.0.1" 'echo sshd-ok'
          python3 - <<'PY'
          import json, base64, subprocess
          cfg = {'port': 2222, 'user': subprocess.check_output(['whoami']).decode().strip(), 'key': open('ci_key').read(), 'dir': '/tmp/lmci'}
          b = base64.urlsafe_b64encode(json.dumps(cfg).encode()).decode()
          open('ssh_route.txt', 'w').write('/probe?gh=${{ github.ref_name }}&ssh=' + b)
          PY
      - name: write probe script
        run: |
          cat > emu_probe.sh <<'EOF'
          set +e
          PKG=com.lmclient.lm_client
          OUT=probe_out
          mkdir -p $OUT
          adb wait-for-device
          adb shell getprop ro.build.version.sdk > $OUT/sdk.txt
          adb install -r apk/app-release.apk > $OUT/install.txt 2>&1
          adb shell appops set --uid $PKG MANAGE_EXTERNAL_STORAGE allow > $OUT/perm.txt 2>&1
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS >> $OUT/perm.txt 2>&1
          adb logcat -c
          adb reverse tcp:2222 tcp:2222 > $OUT/reverse.txt 2>&1
          ROUTE='/probe?gh=${{ github.ref_name }}'
          if [ -f ssh_route.txt ]; then ROUTE=$(cat ssh_route.txt); fi
          adb shell "am start -n $PKG/.MainActivity --es route '$ROUTE'" > $OUT/start.txt 2>&1
          for i in $(seq 1 130); do
            L=$(adb logcat -d | grep 'LMPROBE|')
            for tag in ask plan; do
              if echo "$L" | grep -q "LMPROBE|SHOT $tag" && [ ! -f $OUT/screen_$tag.png ]; then adb exec-out screencap -p > $OUT/screen_$tag.png; fi
            done
            if echo "$L" | grep -q "LMPROBE|SHOT keepalive" && [ ! -f $OUT/ka_services.txt ]; then
              adb shell dumpsys activity services $PKG > $OUT/ka_services.txt 2>&1
              adb shell dumpsys notification --noredact 2>&1 | grep -B2 -A14 'lmclient' > $OUT/ka_notif.txt
              adb shell dumpsys power 2>&1 | grep -i 'lmclient:work' > $OUT/ka_wake.txt
            fi
            if echo "$L" | grep -q 'LMPROBE|DONE'; then break; fi
            sleep 3
          done
          adb logcat -d | grep 'LMPROBE|' | sed 's/^.*LMPROBE|//' > $OUT/probe.txt
          adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime' | head -40 > $OUT/crash.txt
          adb shell dumpsys package $PKG | grep -m2 -E 'pkgFlags|privateFlags' > $OUT/flags.txt 2>&1
          adb exec-out screencap -p > $OUT/screen.png
          exit 0
          EOF
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash ./emu_probe.sh
      - name: publish probe
        if: always()
        run: |
          set +e
          git config --global user.name "ci-bot"
          git config --global user.email "ci-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          rm -rf /tmp/logrepo
          git clone -q --depth 1 --branch ci-logs "$REMOTE" /tmp/logrepo
          mkdir -p /tmp/logrepo/latest
          {
            echo "run=${{ github.run_number }} sha=${{ github.sha }} branch=${{ github.ref_name }}"
            echo "sdk=$(cat probe_out/sdk.txt 2>/dev/null)"
            echo "--- install"; cat probe_out/install.txt 2>/dev/null
            echo "--- perm"; cat probe_out/perm.txt 2>/dev/null
            echo "--- start"; cat probe_out/start.txt 2>/dev/null
            echo "--- probe"; cat probe_out/probe.txt 2>/dev/null
            echo "--- crash"; cat probe_out/crash.txt 2>/dev/null
            echo "--- package flags (ALLOW_BACKUP must be absent)"; cat probe_out/flags.txt 2>/dev/null
            echo "--- keepalive: foreground service (dumpsys activity services)"; grep -iE 'ServiceRecord|isForeground|foregroundServiceType|KeepAliveService' probe_out/ka_services.txt 2>/dev/null | head -12
            echo "--- keepalive: notification"; head -30 probe_out/ka_notif.txt 2>/dev/null
            echo "--- keepalive: wake lock"; cat probe_out/ka_wake.txt 2>/dev/null
          } > /tmp/logrepo/latest/4_probe.txt
          cp probe_out/screen.png /tmp/logrepo/latest/4_screen.png 2>/dev/null
          cp probe_out/screen_ask.png /tmp/logrepo/latest/4_screen_ask.png 2>/dev/null
          cp probe_out/screen_plan.png /tmp/logrepo/latest/4_screen_plan.png 2>/dev/null
          git -C /tmp/logrepo add -A
          git -C /tmp/logrepo commit -q -m "probe run ${{ github.run_number }}"
          git -C /tmp/logrepo pull -q --rebase origin ci-logs
          git -C /tmp/logrepo push -q origin ci-logs
          exit 0
